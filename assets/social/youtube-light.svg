<svg xmlns="http://www.w3.org/2000/svg" width="152" height="44" viewBox="0 0 152 44" role="img" aria-labelledby="title">
<title id="title">YouTube</title>
<style>
@font-face{font-family:'Geist';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.fade-up{opacity:0;animation:fade-up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shimmer{animation:shimmer 6s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-160px)}55%,100%{transform:translateX(var(--shimmer-end))}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

.label{font:500 14px 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#0a0a0a}
</style>
